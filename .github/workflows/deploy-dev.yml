name: CD Build y Deploy Desarrollo (Komodo)

on:
  push:
    branches:
      - develop
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  get-version:
    name: Obtener Version SemVer
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versioning.outputs.version }}
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      # ADR-0001: package.json guarda la proxima version; cada despliegue de dev
      # publica una prerelease unica X.Y.Z-dev.<run_number>.
      - name: Calcular Version de Desarrollo
        id: versioning
        run: |
          BASE=$(node -p "require('./package.json').version")
          VERSION="${BASE}-dev.${GITHUB_RUN_NUMBER}"
          echo "[INFO] Version de dev: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  tag:
    name: Crear Tag Git de la Version de Desarrollo
    # Va despues del despliegue: un fallo al crear el tag no bloquea dev.
    needs: [get-version, deploy-komodo]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Crear y Publicar Tag
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$ ]]; then
            echo "[ERROR] Version con formato inesperado: ${VERSION}"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null 2>&1; then
            echo "[INFO] El tag v${VERSION} ya existe"
            exit 0
          fi
          git tag "v${VERSION}"
          git push origin "refs/tags/v${VERSION}"
          echo "[INFO] Tag v${VERSION} publicado"

  build-backend:
    name: Compilar y Publicar Backend Desarrollo
    needs: [get-version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Iniciar Sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar y Publicar Imagen Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/backend:dev-latest
            ${{ env.IMAGE_BASE }}/backend:dev-v${{ needs.get-version.outputs.version }}

  build-frontend:
    name: Compilar y Publicar Frontend Desarrollo
    needs: [get-version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Iniciar Sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar y Publicar Imagen Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=https://eu.i.posthog.com
            NEXT_PUBLIC_CONTACT_EMAIL=${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
          tags: |
            ${{ env.IMAGE_BASE }}/frontend:dev-latest
            ${{ env.IMAGE_BASE }}/frontend:dev-v${{ needs.get-version.outputs.version }}

  build-gateway:
    name: Compilar y Publicar Gateway Desarrollo
    needs: [get-version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Iniciar Sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar y Publicar Imagen Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./gateway
          file: ./gateway/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/gateway:dev-latest
            ${{ env.IMAGE_BASE }}/gateway:dev-v${{ needs.get-version.outputs.version }}

  deploy-komodo:
    name: Desplegar Stack Desarrollo en Komodo
    needs: [get-version, build-backend, build-frontend, build-gateway]
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Webhook Komodo
        env:
          KOMODO_WEBHOOK: ${{ secrets.KOMODO_WEBHOOK_DEV || secrets.KOMODO_WEBHOOK }}
          KOMODO_SECRET: ${{ secrets.KOMODO_SECRET_DEV || secrets.KOMODO_SECRET }}
        run: |
          echo "Disparando despliegue en Komodo (Entorno Desarrollo)..."
          if [ -z "$KOMODO_WEBHOOK" ]; then
            echo "Error: Secreto KOMODO_WEBHOOK_DEV o KOMODO_WEBHOOK no configurado en el repositorio." >&2
            exit 1
          fi

          # Komodo valida la rama a partir de "ref"; sin ese campo descarta el webhook en silencio.
          BODY="{\"ref\":\"${GITHUB_REF}\"}"
          if [ -n "$KOMODO_SECRET" ]; then
            SIGNATURE="sha256=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$KOMODO_SECRET" | sed 's/^.* //')"
            curl -f -s -X POST "$KOMODO_WEBHOOK" \
              -H "Content-Type: application/json" \
              -H "X-Hub-Signature-256: $SIGNATURE" \
              -d "$BODY"
          else
            curl -f -s -X POST "$KOMODO_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d "$BODY"
          fi
          echo "Despliegue en Komodo completado con exito."
