name: CD Pipeline (Despliegue Inmutable)

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Compilar y Publicar Imagenes (Multi-Tag)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/backend:sha-${{ github.sha }}
            ${{ env.IMAGE_BASE }}/backend:latest

      - name: Construir y publicar imagen Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          tags: |
            ${{ env.IMAGE_BASE }}/frontend:sha-${{ github.sha }}
            ${{ env.IMAGE_BASE }}/frontend:latest

  deploy-prod:
    name: Despliegue en Servidor (Zero-Downtime)
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Checkout de manifiestos
        uses: actions/checkout@v4

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Provisionar entorno de produccion
        run: |
          cat << 'EOF' > .env
          ${{ secrets.ENV_PROD }}
          EOF
          echo "GITHUB_REPOSITORY=${{ github.repository }}" >> .env
          echo "IMAGE_TAG=sha-${{ github.sha }}" >> .env
          chmod 600 .env

      - name: Descargar imagenes inmutables
        run: docker compose -f docker-compose.prod.yml pull

      - name: Aplicar migraciones en contenedor efimero
        run: |
          docker compose -f docker-compose.prod.yml run --rm backend python3 -m alembic upgrade head

      - name: Despliegue progresivo de contenedores
        run: |
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

      - name: Verificacion de salud de servicios
        run: |
          sleep 5
          docker compose -f docker-compose.prod.yml ps
