name: CD Build Produccion (despliegue manual en Komodo)

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  get-version:
    name: Obtener Version SemVer
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versioning.outputs.version }}
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Leer Version SemVer
        id: versioning
        run: |
          VERSION=$(grep '"version"' package.json | head -1 | cut -d'"' -f4)
          echo "Version detectada: ${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

  build-backend:
    name: Compilar y Publicar Backend Produccion
    needs: [get-version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Iniciar Sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar y Publicar Imagen Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ needs.get-version.outputs.version }}
          tags: |
            ${{ env.IMAGE_BASE }}/backend:latest
            ${{ env.IMAGE_BASE }}/backend:v${{ needs.get-version.outputs.version }}

  build-frontend:
    name: Compilar y Publicar Frontend Produccion
    needs: [get-version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Iniciar Sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar y Publicar Imagen Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=https://eu.i.posthog.com
            NEXT_PUBLIC_CONTACT_EMAIL=${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
            APP_VERSION=${{ needs.get-version.outputs.version }}
          tags: |
            ${{ env.IMAGE_BASE }}/frontend:latest
            ${{ env.IMAGE_BASE }}/frontend:v${{ needs.get-version.outputs.version }}

  build-gateway:
    name: Compilar y Publicar Gateway Produccion
    needs: [get-version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Iniciar Sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar y Publicar Imagen Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./gateway
          file: ./gateway/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/gateway:latest
            ${{ env.IMAGE_BASE }}/gateway:v${{ needs.get-version.outputs.version }}

  tag:
    name: Crear Tag Git de la Version de Produccion
    # Produccion no se despliega desde aqui: se cambia IMAGE_TAG en Komodo
    # (docs/operaciones/despliegue.md). El tag marca la version publicada.
    needs: [get-version, build-backend, build-frontend, build-gateway]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Crear y Publicar Tag
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "[ERROR] Version con formato inesperado: ${VERSION}"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null 2>&1; then
            echo "[INFO] El tag v${VERSION} ya existe"
            exit 0
          fi
          git tag "v${VERSION}"
          git push origin "refs/tags/v${VERSION}"
          echo "[INFO] Tag v${VERSION} publicado"
