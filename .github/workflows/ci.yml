name: CI Pipeline (Validacion de Codigo)

on:
  pull_request:
    branches:
      - main
      - develop
  # Ejecucion completa manual: ignora el filtro de ficheros y la marca de cache.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detectar cambios
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
    steps:
      - name: Filtrar ficheros cambiados
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose*.yml'
              - 'requirements*'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
              - 'tests/hooks/**'
              - '.claude/hooks/**'
              - '.githooks/**'

  # Si un job se salta por `if:`, GitHub lo da por satisfecho en la proteccion de
  # ramas. Si no se salta, una marca en actions/cache (clave <job>-ok-<hash de
  # entradas>) evita repetir los pasos pesados con codigo ya probado. La marca
  # solo se guarda si todos los pasos anteriores pasaron.
  backend-qa:
    name: Backend QA (Ruff, Migraciones, Pytest)
    needs: changes
    # Falla cerrado: si `changes` falla, el job corre en lugar de saltarse.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ski_test_user
          POSTGRES_PASSWORD: ski_test_password
          POSTGRES_DB: ski_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Consultar marca de codigo ya probado
        id: mark
        if: github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: .ci-mark
          key: backend-qa-ok-${{ hashFiles('backend/**', 'requirements*', 'docker-compose*.yml', '.github/workflows/ci.yml') }}
          lookup-only: true

      - name: Codigo ya probado (marca encontrada)
        if: steps.mark.outputs.cache-hit == 'true'
        run: echo "OK Backend QA omitido, el mismo codigo ya paso en este PR"

      - name: Configurar Python 3.12
        if: steps.mark.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias del backend
        if: steps.mark.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest pytest-asyncio httpx

      - name: Verificacion de estilo y formato (Ruff)
        if: steps.mark.outputs.cache-hit != 'true'
        run: ruff check backend/

      - name: Validar migraciones de base de datos
        if: steps.mark.outputs.cache-hit != 'true'
        env:
          DATABASE_URL: postgresql://ski_test_user:ski_test_password@localhost:5432/ski_test_db
          ENCRYPTION_KEY: dGVzdF9rZXlfZm9yX2NpX3ZhbGlkYXRpb25fcHVycG9zZXM=
        run: |
          cd backend
          python3 -m alembic upgrade head

      - name: Ejecutar pruebas unitarias (Pytest)
        if: steps.mark.outputs.cache-hit != 'true'
        env:
          DATABASE_URL: postgresql://ski_test_user:ski_test_password@localhost:5432/ski_test_db
          TEST_DATABASE_URL: postgresql://ski_test_user:ski_test_password@localhost:5432/ski_test_db
          REDIS_URL: redis://localhost:6379/0
          ENCRYPTION_KEY: dGVzdF9rZXlfZm9yX2NpX3ZhbGlkYXRpb25fcHVycG9zZXM=
          SECRET_KEY: test_secret_key_ci_verification_only_not_for_prod
        run: |
          cd backend
          # Los tests que ejecutan DDL (ALTER/DROP, migraciones) toman locks sobre tablas
          # compartidas de la BD y bloquean a los demas workers (se verifico un bloqueo con 12
          # workers). Se excluyen de la fase paralela y corren despues en serie.
          DDL_TESTS="tests/test_migration_company_name.py tests/test_migration_fiscal_id.py tests/test_migration_manual_views.py tests/test_migration_settings_definitions.py tests/test_migration_tax_keys.py tests/scripts/test_repair_fiscal_id.py"
          IGNORE=""
          for f in $DDL_TESTS; do IGNORE="$IGNORE --ignore=$f"; done
          pytest tests/ -n auto $IGNORE
          pytest $DDL_TESTS

      - name: Escribir marca de codigo probado
        if: steps.mark.outputs.cache-hit != 'true' && github.event_name != 'workflow_dispatch'
        run: |
          mkdir -p .ci-mark
          echo ok > .ci-mark/ok

      - name: Guardar marca de codigo probado
        if: steps.mark.outputs.cache-hit != 'true' && github.event_name != 'workflow_dispatch'
        uses: actions/cache/save@v4
        with:
          path: .ci-mark
          key: backend-qa-ok-${{ hashFiles('backend/**', 'requirements*', 'docker-compose*.yml', '.github/workflows/ci.yml') }}

  frontend-qa:
    name: Frontend QA (Lint, Types, Tests, Build)
    needs: changes
    # Falla cerrado: si `changes` falla, el job corre en lugar de saltarse.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Consultar marca de codigo ya probado
        id: mark
        if: github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: .ci-mark
          key: frontend-qa-ok-${{ hashFiles('frontend/**', '.github/workflows/ci.yml', 'tests/hooks/**', '.claude/hooks/**', '.githooks/**') }}
          lookup-only: true

      - name: Codigo ya probado (marca encontrada)
        if: steps.mark.outputs.cache-hit == 'true'
        run: echo "OK Frontend QA omitido, el mismo codigo ya paso en este PR"

      - name: Configurar Node.js 20
        if: steps.mark.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Pruebas de los hooks de agentes
        if: steps.mark.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        # Sin comillas: Node 20 no expande globs en --test, lo hace el shell.
        run: node --test tests/hooks/*.test.mjs

      - name: Instalar dependencias del frontend
        if: steps.mark.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Verificacion de linteo (ESLint)
        if: steps.mark.outputs.cache-hit != 'true'
        run: npm run lint

      - name: Verificacion estricta de tipos (TypeScript)
        if: steps.mark.outputs.cache-hit != 'true'
        run: npx tsc --noEmit

      - name: Pruebas unitarias (Vitest)
        if: steps.mark.outputs.cache-hit != 'true'
        run: npm test

      - name: Compilacion de produccion (Next.js Build)
        if: steps.mark.outputs.cache-hit != 'true'
        env:
          NEXT_PUBLIC_API_URL: /api
        run: npm run build

      - name: Escribir marca de codigo probado
        if: steps.mark.outputs.cache-hit != 'true' && github.event_name != 'workflow_dispatch'
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p .ci-mark
          echo ok > .ci-mark/ok

      - name: Guardar marca de codigo probado
        if: steps.mark.outputs.cache-hit != 'true' && github.event_name != 'workflow_dispatch'
        uses: actions/cache/save@v4
        with:
          path: .ci-mark
          key: frontend-qa-ok-${{ hashFiles('frontend/**', '.github/workflows/ci.yml', 'tests/hooks/**', '.claude/hooks/**', '.githooks/**') }}
