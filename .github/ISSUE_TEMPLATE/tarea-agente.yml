name: Tarea de agente
description: Trabajo acotado que puede hacer un agente. Ver docs/flujo/issues.md.
title: "<tipo>(<ambito>): <descripcion>"
labels: ["tipo/feat"]
body:
  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo
      description: Que tiene que existir o funcionar al terminar. Un solo objetivo.
    validations:
      required: true
  - type: textarea
    id: contexto
    attributes:
      label: Contexto a leer
      description: Rutas exactas (y seccion si el fichero es largo). Nunca "docs/".
      placeholder: |
        - docs/empresa/logica-negocio-empresa.md#5-membresia
        - backend/routers/v2/companies.py
    validations:
      required: true
  - type: textarea
    id: reglas
    attributes:
      label: Reglas afectadas
      description: IDs de reglas de dominio (R-XXX-NN), seccion del documento de dominio, o "ninguna (solo docs)".
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptacion
      description: Checklist verificable con un comando o un test.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: fuera-alcance
    attributes:
      label: Fuera de alcance
      description: Lo que NO hay que hacer en esta issue.
    validations:
      required: true
  - type: textarea
    id: ficheros
    attributes:
      label: Ficheros probables
      description: Ficheros que probablemente se crean o modifican. Indica si hay migracion Alembic.
    validations:
      required: true
