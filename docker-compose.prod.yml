name: ${COMPOSE_PROJECT_NAME:-ski_prod}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-ski_prod}-postgres
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPU_LIMIT:-1.0}"
          memory: ${POSTGRES_MEMORY_LIMIT:-1g}
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data:z
    networks:
      - prod_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-ski_prod}-redis
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data:z
    networks:
      - prod_db
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    image: ghcr.io/${GITHUB_REPOSITORY:-hugovelez16/saas-ski-portal}/backend:${IMAGE_TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-ski_prod}-migrate
    restart: "no"
    logging: *default-logging
    command: ["python3", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    networks:
      - prod_db

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY:-hugovelez16/saas-ski-portal}/backend:${IMAGE_TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-ski_prod}-backend
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${BACKEND_CPU_LIMIT:-1.0}"
          memory: ${BACKEND_MEMORY_LIMIT:-768m}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
    networks:
      - prod_app
      - prod_db
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY:-hugovelez16/saas-ski-portal}/frontend:${IMAGE_TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-ski_prod}-frontend
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${FRONTEND_CPU_LIMIT:-0.5}"
          memory: ${FRONTEND_MEMORY_LIMIT:-512m}
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - BACKEND_INTERNAL_URL=http://backend:8000
    networks:
      - prod_app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  gateway:
    image: ghcr.io/${GITHUB_REPOSITORY:-hugovelez16/saas-ski-portal}/gateway:${IMAGE_TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-ski_prod}-gateway
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - prod_app

  pgbackups:
    image: prodrigestivill/postgres-backup-local
    container_name: ${COMPOSE_PROJECT_NAME:-ski_prod}-pgbackups
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ${BACKUP_DIR:-/mnt/nas_backups/clases-vesotel}:/backups:z
    networks:
      - prod_db
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SCHEDULE=${BACKUP_SCHEDULE:-@daily}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-7}
      - BACKUP_KEEP_WEEKS=${BACKUP_KEEP_WEEKS:-4}
      - BACKUP_KEEP_MONTHS=${BACKUP_KEEP_MONTHS:-3}

volumes:
  postgres_data:
  redis_data:

networks:
  prod_app:
    driver: bridge
  prod_db:
    driver: bridge
    internal: true
