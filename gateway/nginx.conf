user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;
    server_tokens off;

    # Compresion Gzip para trafico de produccion
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Negociacion dinamica de WebSockets
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # IP real del cliente tras los proxies. El script docker-entrypoint.d/40-real-ip.sh genera
    # real-ip.conf desde TRUSTED_PROXIES. Sin la variable no se confia en nadie y $remote_addr
    # es la IP del salto directo.
    include /etc/nginx/real-ip.d/*.conf;

    log_format main '$remote_addr realip_from=$realip_remote_addr xff="$http_x_forwarded_for" '
                    '[$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;

    # Rate limit por IP real. Una clave vacia no cuenta: solo se limita lo que el mapa selecciona.
    limit_req_status 429;

    map $uri $auth_limit_key {
        default "";
        ~^/api/(token|verify-2fa|auth/dev-login|auth/forgot-password|auth/reset-password)/?$ $binary_remote_addr;
        ~^/api/2fa/ $binary_remote_addr;
        ~^/api/admin/impersonate/ $binary_remote_addr;
        ~^/api/users/me/change-password/?$ $binary_remote_addr;
        ~^/api/users/[^/]+/reset-password-email/?$ $binary_remote_addr;
    }

    map $uri $refresh_limit_key {
        default "";
        ~^/api/refresh-token/?$ $binary_remote_addr;
    }

    limit_req_zone $auth_limit_key zone=auth_zone:10m rate=10r/m;
    limit_req_zone $refresh_limit_key zone=refresh_zone:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=600r/m;

    upstream backend_upstream {
        server backend:8000;
    }

    upstream frontend_upstream {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # Cabeceras de seguridad. Ninguna location define add_header propio, asi que heredan estas.
        # Si una location anade un add_header, debe repetir todo este bloque.
        # HSTS: pendiente de confirmar la terminacion TLS en la cadena de despliegue.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), clipboard-write=(self)" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://quickchart.io; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://fonts.gstatic.com https://quickchart.io; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

        # Sonda de salud (Health Check)
        location = /health {
            proxy_pass http://backend_upstream/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API backend
        location /api/ {
            proxy_pass http://backend_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            limit_req zone=auth_zone burst=5 nodelay;
            limit_req zone=refresh_zone burst=20 nodelay;
            limit_req zone=api_zone burst=200 nodelay;
        }

        # Frontend Next.js (SSR, estaticos y WebSockets)
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_hide_header X-Powered-By;
        }
    }
}
